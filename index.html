<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 BBQ 食物統計小幫手 🔥</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #d9534f;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .food-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .food-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #eee;
        }
        .food-name {
            font-size: 16px;
            font-weight: bold;
            color: #444;
            flex-grow: 1;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button.btn-ctrl {
            background-color: #e0e0e0;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-ctrl:active {
            background-color: #ccc;
        }
        input.qty-input {
            width: 50px;
            text-align: center;
            font-size: 16px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        .summary-section {
            margin-top: 30px;
            background: #fff8f8;
            border: 1px dashed #d9534f;
            padding: 20px;
            border-radius: 12px;
        }
        .summary-section h2 {
            font-size: 18px;
            color: #d9534f;
            margin-top: 0;
            margin-bottom: 10px;
        }
        #summary-list {
            margin: 0;
            padding-left: 20px;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn-action {
            display: block;
            width: 100%;
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 BBQ 食物點餐統計 🔥</h1>
    <p class="subtitle">點選你想準備嘅數量，下方會自動幫你加總！</p>

    <div class="food-grid" id="foodGrid"></div>

    <div class="summary-section">
        <h2>📋 採購總數清單</h2>
        <ul id="summary-list">
            <li>暫時未選擇任何食物</li>
        </ul>
        <button class="btn-action" onclick="copySummary()">一鍵複製總數清單 📋</button>
    </div>
</div>

<script>
    const foods = [
        "雞翼", "豬扒", "雞扒", "牛仔骨", "牛扒", 
        "豬頸肉", "金沙骨", "魷魚", "羊架", 
        "廚師腸", "芝士腸", "麵包", "多春魚"
    ];

    const foodGrid = document.getElementById('foodGrid');
    const summaryList = document.getElementById('summary-list');

    foods.forEach((food, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'food-item';
        itemDiv.innerHTML = `
            <span class="food-name">${food}</span>
            <div class="controls">
                <button class="btn-ctrl" onclick="updateQty(${index}, -1)">-</button>
                <input type="number" id="qty-${index}" class="qty-input" value="0" min="0" oninput="updateSummary()">
                <button class="btn-ctrl" onclick="updateQty(${index}, 1)">+</button>
            </div>
        `;
        foodGrid.appendChild(itemDiv);
    });

    function updateQty(index, change) {
        const input = document.getElementById(`qty-${index}`);
        let currentVal = parseInt(input.value) || 0;
        let newVal = currentVal + change;
        if (newVal < 0) newVal = 0;
        input.value = newVal;
        updateSummary();
    }

    function updateSummary() {
        summaryList.innerHTML = '';
        let totalCount = 0;
        let hasItem = false;

        foods.forEach((food, index) => {
            const qty = parseInt(document.getElementById(`qty-${index}`).value) || 0;
            if (qty > 0) {
                hasItem = true;
                totalCount += qty;
                const li = document.createElement('li');
                li.innerHTML = `<b>${food}</b>：${qty} 件 / 份`;
                summaryList.appendChild(li);
            }
        });

        if (!hasItem) {
            summaryList.innerHTML = '<li>暫時未選擇任何食物</li>';
        } else {
            const totalLi = document.createElement('li');
            totalLi.style.marginTop = '10px';
            totalLi.style.color = '#d9534f';
            totalLi.innerHTML = `<b>總合件數/份數：${totalCount}</b>`;
            summaryList.appendChild(totalLi);
        }
    }

    function copySummary() {
        let text = "🔥 BBQ 採購清單 🔥\n";
        let hasItem = false;
        let totalCount = 0;

        foods.forEach((food, index) => {
            const qty = parseInt(document.getElementById(`qty-${index}`).value) || 0;
            if (qty > 0) {
                hasItem = true;
                totalCount += qty;
                text += `- ${food}: ${qty}\n`;
            }
        });

        if (!hasItem) {
            alert("目前未有選擇任何食物哦！");
            return;
        }

        text += `\n總合件數/份數：${totalCount}`;

        navigator.clipboard.writeText(text).then(() => {
            alert("✅ 已經成功複製清單！可以直接去 WhatsApp 貼上！");
        }).catch(err => {
            alert("❌ 複製失敗，請手動複製。");
        });
    }
</script>

</body>
</html>
